    <script>
      (function() {
        // Prevent @vite/client WebSocket closed without opened error in AI Studio iFrame environment
        try {
          var RealWebSocket = window.WebSocket;
          if (RealWebSocket) {
            window.WebSocket = function(url, protocols) {
              var isHmr = false;
              try {
                if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
                  isHmr = true;
                }
                if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite') !== -1)) {
                  isHmr = true;
                }
              } catch (e) {}

              if (isHmr) {
                var listeners = {};
                var fakeWs = {
                  readyState: 1, // WebSocket.OPEN
                  binaryType: 'blob',
                  protocol: 'vite-hmr',
                  url: String(url),
                  extensions: '',
                  bufferedAmount: 0,
                  send: function() {},
                  close: function() {},
                  addEventListener: function(type, fn) {
                    if (!listeners[type]) listeners[type] = [];
                    listeners[type].push(fn);
                    if (type === 'open') {
                      setTimeout(function() {
                        try { fn({ type: 'open', target: fakeWs }); } catch (err) {}
                      }, 0);
                    }
                  },
                  removeEventListener: function(type, fn) {
                    if (listeners[type]) {
                      listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                    }
                  },
                  dispatchEvent: function(event) {
                    var fns = listeners[event && event.type];
                    if (fns) {
                      fns.forEach(function(fn) {
                        try { fn(event); } catch (err) {}
                      });
                    }
                    return true;
                  }
                };
                return fakeWs;
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {}

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          var stack = (reason && reason.stack) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            stack.indexOf('vite-hmr') !== -1
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        });
        window.addEventListener('error', function(event) {
          var filename = (event && event.filename) || '';
          var msg = (event && event.message) || '';
          if (
            filename.indexOf('@vite/client') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            filename.indexOf('vite-hmr') !== -1
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
        function applyLightMode() {
          try {
            var topColor = '#ffffff';
            var themeMetas = document.querySelectorAll('meta[name="theme-color"]');
            themeMetas.forEach(function(meta) {
              meta.setAttribute('content', topColor);
            });
            var statusMeta = document.getElementById('apple-status-bar-meta');
            if (statusMeta) statusMeta.setAttribute('content', 'black-translucent');

            document.documentElement.style.backgroundColor = topColor;
            document.documentElement.style.colorScheme = 'light';
            if (document.body) document.body.style.backgroundColor = topColor;
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            localStorage.setItem('monvian_theme', 'light');

            var preloader = document.getElementById('monvian-app-preloader');
            if (preloader) preloader.style.backgroundColor = '#ffffff';
          } catch (e) {}
        }
        applyLightMode();
      })();
    </script>
    <script>
      (function() {
        var dismissed = false;
        function hasAuthenticatedSession() {
          try {
            var token = localStorage.getItem('monvian_token');
            var user = localStorage.getItem('monvian_user');
            return Boolean(token && user);
          } catch (e) {
            return false;
          }
        }

        function hidePreloaderImmediately() {
          dismissed = true;
          var preloader = document.getElementById('monvian-app-preloader');
          var video = document.getElementById('monvian-preloader-video');
          if (video) {
            try { video.pause(); } catch (e) {}
          }
          if (preloader) {
            preloader.style.display = 'none';
            preloader.style.opacity = '0';
            preloader.style.pointerEvents = 'none';
          }
        }

        function dismissPreloader() {
          if (dismissed) return;
          dismissed = true;
          var preloader = document.getElementById('monvian-app-preloader');
          var video = document.getElementById('monvian-preloader-video');

          // 1. Video fades out smoothly
          if (video) {
            try { video.pause(); } catch (e) {}
            video.style.transition = 'opacity 0.4s ease-out';
            video.style.opacity = '0';
          }

          // 2. Preloader fades out seamlessly revealing the app underneath without shifting elements
          if (preloader) {
            preloader.style.transition = 'opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1)';
            preloader.style.opacity = '0';
            preloader.style.pointerEvents = 'none';

            setTimeout(function() {
              preloader.style.display = 'none';
            }, 520);
          }
        }

        function initVideoPreloader() {
          // Never show the Monvian logo loading screen on the Login / Landing screen
          if (!hasAuthenticatedSession()) {
            hidePreloaderImmediately();
            return;
          }

          var preloader = document.getElementById('monvian-app-preloader');
          if (preloader) {
            preloader.style.display = 'flex';
          }

          var video = document.getElementById('monvian-preloader-video');
          if (video) {
            video.addEventListener('ended', function() {
              dismissPreloader();
            });
            video.addEventListener('error', function() {
              setTimeout(dismissPreloader, 600);
            });
            var p = video.play();
            if (p && typeof p.catch === 'function') {
              p.catch(function() {
                setTimeout(dismissPreloader, 1800);
              });
            }
          }
          // Safety fallback
          setTimeout(dismissPreloader, 2800);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initVideoPreloader);
        } else {
          initVideoPreloader();
        }
      })();
    </script>
    <!-- Dynamic Viewport Height & Zoom Lock for iOS/Android Mobile Devices -->
    <script>
      (function() {
        function isTextInputActive() {
          try {
            var el = document.activeElement;
            if (!el) return false;
            var tag = (el.tagName || '').toUpperCase();
            return tag === 'INPUT' || tag === 'TEXTAREA' || Boolean(el.isContentEditable);
          } catch (e) {
            return false;
          }
        }

        function updateAppHeight() {
          try {
            var isStandalone =
              Boolean(window.navigator && window.navigator.standalone === true) ||
              Boolean(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

            var isLandscape =
              Boolean(window.matchMedia && window.matchMedia('(orientation: landscape)').matches) ||
              Math.abs(Number(window.orientation) || 0) === 90 ||
              window.innerWidth > window.innerHeight;

            var screenH = 0;
            if (window.screen && window.screen.height && window.screen.width) {
              screenH = isLandscape
                ? Math.min(window.screen.width, window.screen.height)
                : Math.max(window.screen.width, window.screen.height);
            }

            var innerH = window.innerHeight || 0;
            var clientH = (document.documentElement && document.documentElement.clientHeight) || 0;
            var vvH = (window.visualViewport && window.visualViewport.height) || 0;

            var keyboardOpen = isTextInputActive() && vvH > 0 && screenH > 0 && vvH < screenH * 0.78;

            var h = 0;
            var isIOS = /iPhone|iPod|iPad/i.test(navigator.userAgent || '') ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (keyboardOpen) {
              h = Math.round(vvH || innerH || clientH);
            } else if (isStandalone && screenH > 0) {
              // In iOS PWA standalone mode, prevent WebKit cold-launch safe-area under-reporting
              h = Math.round(Math.max(innerH, clientH, vvH, screenH));
            } else {
              var candidate = Math.max(innerH, clientH, vvH);
              // On iOS devices where screenH is within safe-area delta of candidate, use full screenH
              if (isIOS && screenH > candidate && (screenH - candidate) <= 130) {
                h = Math.round(screenH);
              } else {
                h = Math.round(candidate || screenH);
              }
            }

            if (keyboardOpen && h > 0) {
              var hPx = h + 'px';
              document.documentElement.style.setProperty('--app-height', hPx);
              document.documentElement.style.height = hPx;
              document.documentElement.style.minHeight = hPx;
              if (document.body) {
                document.body.style.height = hPx;
                document.body.style.minHeight = hPx;
              }
              var rootEl = document.getElementById('root');
              if (rootEl) {
                rootEl.style.height = hPx;
                rootEl.style.minHeight = hPx;
              }
            } else {
              var fullH = h > 0
                ? 'max(' + h + 'px, 100dvh, 100lvh, calc(100% + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px)))'
                : 'max(100dvh, 100lvh, calc(100% + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px)))';
              document.documentElement.style.setProperty('--app-height', fullH);
              document.documentElement.style.height = fullH;
              document.documentElement.style.minHeight = fullH;
              if (document.body) {
                document.body.style.height = fullH;
                document.body.style.minHeight = fullH;
              }
              var rootElReset = document.getElementById('root');
              if (rootElReset) {
                rootElReset.style.height = fullH;
                rootElReset.style.minHeight = fullH;
              }
            }

            if (
              !keyboardOpen &&
              document.body &&
              !document.body.classList.contains('is-login-screen') &&
              !document.documentElement.classList.contains('is-login-screen')
            ) {
              if (window.scrollTo) window.scrollTo(0, 0);
              document.documentElement.scrollTop = 0;
              document.body.scrollTop = 0;
            }

            try {
              window.dispatchEvent(new CustomEvent('monvian:viewport-stabilized', { detail: { height: h } }));
            } catch (err) {}
          } catch (e) {}
        }

        function scheduleViewportStabilization() {
          updateAppHeight();
          if (window.requestAnimationFrame) {
            window.requestAnimationFrame(updateAppHeight);
          }
          setTimeout(updateAppHeight, 50);
          setTimeout(updateAppHeight, 150);
          setTimeout(updateAppHeight, 300);
          setTimeout(updateAppHeight, 600);
          setTimeout(updateAppHeight, 1000);
        }

        scheduleViewportStabilization();
        if (window.scrollTo) window.scrollTo(0, 0);

        window.addEventListener('resize', updateAppHeight, { passive: true });
        window.addEventListener('orientationchange', scheduleViewportStabilization, { passive: true });
        window.addEventListener('pageshow', scheduleViewportStabilization, { passive: true });
        window.addEventListener('focus', scheduleViewportStabilization, { passive: true });
        window.addEventListener('load', scheduleViewportStabilization, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', updateAppHeight, { passive: true });
          window.visualViewport.addEventListener('scroll', updateAppHeight, { passive: true });
        }
        if (window.screen && window.screen.orientation) {
          window.screen.orientation.addEventListener('change', scheduleViewportStabilization, { passive: true });
        }
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') scheduleViewportStabilization();
        }, { passive: true });

        // Helper: Check if touch/event target is inside the interactive map or login screen
        function isZoomAllowed(target) {
          if (!target) return false;
          if (target.nodeType === 3) target = target.parentElement; // handle text nodes
          // 1. Interactive map
          if (target && target.closest && target.closest('.maplibregl-map, .maplibregl-canvas-container, .maplibregl-canvas, #map, [data-map-container]')) {
            return true;
          }
          // 2. Login & Auth screens
          if (target && target.closest && target.closest('#auth-main-section, [data-allow-zoom="true"], .auth-login-screen, #input-login-email, #input-login-password, .login-zoom-container')) {
            return true;
          }
          if (document.body && (document.body.classList.contains('is-login-screen') || document.documentElement.classList.contains('is-login-screen'))) {
            return true;
          }
          return false;
        }

        // Prevent pinch gesture zoom on iOS Safari outside map and login screen
        document.addEventListener('gesturestart', function(e) {
          if (!isZoomAllowed(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('gesturechange', function(e) {
          if (!isZoomAllowed(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('gestureend', function(e) {
          if (!isZoomAllowed(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent multi-touch pinch on body/elements outside map and login screen
        document.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 1) {
            if (!isZoomAllowed(e.target)) {
              e.preventDefault();
            }
          }
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            if (!isZoomAllowed(e.target)) {
              e.preventDefault();
            }
          }
        }, { passive: false });

        // Prevent Ctrl + Mouse Wheel zoom on UI elements outside map and login screen
        document.addEventListener('wheel', function(e) {
          if (e.ctrlKey && !isZoomAllowed(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent keyboard zoom shortcuts (Ctrl/Cmd + +/-/0) outside map and login screen
        document.addEventListener('keydown', function(e) {
          if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
            if (!isZoomAllowed(e.target)) {
              e.preventDefault();
            }
          }
        });
      })();
    </script>
