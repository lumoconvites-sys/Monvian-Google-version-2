  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Monvian" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="apple-status-bar-meta" />
    <meta name="theme-color" content="#000000" id="theme-color-meta" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/loogo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/loogo.png" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('monvian_theme');
          var isDark = savedTheme === 'dark';
          var topColor = isDark ? '#000000' : '#ffffff';
          var statusStyle = isDark ? 'black-translucent' : 'default';
          var logoSrc = isDark ? '/loogo.png' : '/logocarregamento.png';

          var themeMetas = document.querySelectorAll('meta[name="theme-color"]');
          themeMetas.forEach(function(meta) {
            meta.setAttribute('content', topColor);
          });
          var statusMeta = document.getElementById('apple-status-bar-meta');
          if (statusMeta) statusMeta.setAttribute('content', statusStyle);

          document.documentElement.style.backgroundColor = topColor;
          if (document.body) document.body.style.backgroundColor = topColor;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }

          var preloader = document.getElementById('monvian-app-preloader');
          if (preloader) preloader.style.backgroundColor = '#ffffff';
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        var dismissed = false;
        function dismissPreloader() {
          if (dismissed) return;
          dismissed = true;
          var preloader = document.getElementById('monvian-app-preloader');
          var video = document.getElementById('monvian-preloader-video');
          var rootEl = document.getElementById('root');

          // 1. Logo fades out smoothly after the video finishes
          if (video) {
            try { video.pause(); } catch (e) {}
            video.style.transition = 'opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1), filter 0.48s cubic-bezier(0.22, 1, 0.36, 1), transform 0.48s cubic-bezier(0.22, 1, 0.36, 1)';
            video.style.opacity = '0';
            video.style.filter = 'blur(6px)';
            video.style.transform = 'scale(1.44)';
          }

          // 2. App appears with a translucent frosted-glass transition
          if (preloader) {
            setTimeout(function() {
              // Shift solid background into a translucent glass veil over the app
              preloader.style.transition =
                'background-color 0.68s cubic-bezier(0.16, 1, 0.3, 1), ' +
                'backdrop-filter 0.68s cubic-bezier(0.16, 1, 0.3, 1), ' +
                '-webkit-backdrop-filter 0.68s cubic-bezier(0.16, 1, 0.3, 1), ' +
                'opacity 0.68s cubic-bezier(0.16, 1, 0.3, 1)';
              preloader.style.backgroundColor = 'rgba(255, 255, 255, 0.22)';
              preloader.style.backdropFilter = 'blur(0px) saturate(100%)';
              preloader.style.webkitBackdropFilter = 'blur(0px) saturate(100%)';
              preloader.style.opacity = '0';

              if (rootEl) {
                rootEl.style.transition =
                  'filter 0.68s cubic-bezier(0.16, 1, 0.3, 1), ' +
                  'opacity 0.68s cubic-bezier(0.16, 1, 0.3, 1), ' +
                  'transform 0.68s cubic-bezier(0.16, 1, 0.3, 1)';
                rootEl.style.filter = 'blur(0px)';
                rootEl.style.opacity = '1';
                rootEl.style.transform = 'scale(1)';
              }

              setTimeout(function() {
                preloader.style.display = 'none';
                if (rootEl) {
                  rootEl.style.filter = '';
                  rootEl.style.transform = '';
                  rootEl.style.transition = '';
                }
              }, 700);
            }, 340);
          }
        }

        function initVideoPreloader() {
          var video = document.getElementById('monvian-preloader-video');
          var rootEl = document.getElementById('root');
          if (rootEl) {
            rootEl.style.filter = 'blur(16px)';
            rootEl.style.opacity = '0.82';
            rootEl.style.transform = 'scale(0.985)';
          }
          if (video) {
            video.addEventListener('ended', function() {
              dismissPreloader();
            });
            video.addEventListener('error', function() {
              setTimeout(dismissPreloader, 800);
            });
            var p = video.play();
            if (p && typeof p.catch === 'function') {
              p.catch(function() {
                setTimeout(dismissPreloader, 2200);
              });
            }
          }
          // Safety fallback after video duration (2.68s)
          setTimeout(dismissPreloader, 3050);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initVideoPreloader);
        } else {
          initVideoPreloader();
        }
      })();
    </script>
    <!-- Dynamic Viewport Height & Zoom Lock for iOS/Android Mobile Devices -->
    <script>
      (function() {
        function updateAppHeight() {
          try {
            var h = (window.visualViewport && window.visualViewport.height) ||
              window.innerHeight ||
              (document.documentElement && document.documentElement.clientHeight) ||
              0;

            if (h && h > 0) {
              document.documentElement.style.setProperty('--app-height', h + 'px');
            }
          } catch (e) {}
        }

        updateAppHeight();
        if (window.scrollTo) window.scrollTo(0, 0);

        function handleOrientation() {
          updateAppHeight();
          if (window.requestAnimationFrame) window.requestAnimationFrame(updateAppHeight);
          setTimeout(updateAppHeight, 50);
          setTimeout(updateAppHeight, 150);
        }

        window.addEventListener('resize', updateAppHeight, { passive: true });
        window.addEventListener('orientationchange', handleOrientation, { passive: true });
        window.addEventListener('pageshow', updateAppHeight, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', updateAppHeight, { passive: true });
        }
        if (window.screen && window.screen.orientation) {
          window.screen.orientation.addEventListener('change', handleOrientation, { passive: true });
        }
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') updateAppHeight();
        }, { passive: true });

        // Helper: Check if touch/event target is inside the interactive map
        function isInsideMap(target) {
          if (!target) return false;
          if (target.nodeType === 3) target = target.parentElement; // handle text nodes
          return !!(target && target.closest && target.closest('.maplibregl-map, .maplibregl-canvas-container, .maplibregl-canvas, #map, [data-map-container]'));
        }

        // Prevent pinch gesture zoom on iOS Safari outside map
        document.addEventListener('gesturestart', function(e) {
          if (!isInsideMap(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('gesturechange', function(e) {
          if (!isInsideMap(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('gestureend', function(e) {
          if (!isInsideMap(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent multi-touch pinch on body/elements outside map
        document.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 1) {
            if (!isInsideMap(e.target)) {
              e.preventDefault();
            }
          }
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            if (!isInsideMap(e.target)) {
              e.preventDefault();
            }
          }
        }, { passive: false });

        // Prevent Ctrl + Mouse Wheel zoom on UI elements outside map
        document.addEventListener('wheel', function(e) {
          if (e.ctrlKey && !isInsideMap(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent keyboard zoom shortcuts (Ctrl/Cmd + +/-/0)
        document.addEventListener('keydown', function(e) {
          if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
            e.preventDefault();
          }
        });
      })();
    </script>

    <style>
      @keyframes monvianLogoSpringEnter {

          opacity: 1;
          transform: translateY(-2px) scale(1.03);

        }
      }

          opacity: 1;
