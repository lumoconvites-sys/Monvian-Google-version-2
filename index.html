  <head>

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="apple-status-bar-meta" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />

    <script>
      (function() {
        // Prevent @vite/client WebSocket closed without opened error in AI Studio iFrame environment
        try {
          var RealWebSocket = window.WebSocket;
          if (RealWebSocket) {
            window.WebSocket = function(url, protocols) {
              var isHmr = false;
              try {
                if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
                  isHmr = true;
                }
                if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite') !== -1)) {
                  isHmr = true;
                }
              } catch (e) {}

              if (isHmr) {
                var listeners = {};
                var fakeWs = {
                  readyState: 1, // WebSocket.OPEN
                  binaryType: 'blob',
                  protocol: 'vite-hmr',
                  url: String(url),
                  extensions: '',
                  bufferedAmount: 0,
                  send: function() {},
                  close: function() {},
                  addEventListener: function(type, fn) {
                    if (!listeners[type]) listeners[type] = [];
                    listeners[type].push(fn);
                    if (type === 'open') {
                      setTimeout(function() {
                        try { fn({ type: 'open', target: fakeWs }); } catch (err) {}
                      }, 0);
                    }
                  },
                  removeEventListener: function(type, fn) {
                    if (listeners[type]) {
                      listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                    }
                  },
                  dispatchEvent: function(event) {
                    var fns = listeners[event && event.type];
                    if (fns) {
                      fns.forEach(function(fn) {
                        try { fn(event); } catch (err) {}
                      });
                    }
                    return true;
                  }
                };
                return fakeWs;
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {}

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          var stack = (reason && reason.stack) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            stack.indexOf('vite-hmr') !== -1
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        });
        window.addEventListener('error', function(event) {
          var filename = (event && event.filename) || '';
          var msg = (event && event.message) || '';
          if (
            filename.indexOf('@vite/client') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            filename.indexOf('vite-hmr') !== -1
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
        function isDarkThemeActive() {
          try {
            var savedMode = localStorage.getItem('monvian_theme_mode');
            var saved = localStorage.getItem('monvian_theme');
            if (savedMode === 'dark') return true;
            if (savedMode === 'light') return false;
            if (savedMode === 'system' && window.matchMedia) {
              return window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            return saved === 'dark';
          } catch (e) {
            return false;
          }
        }

        function applySavedTheme() {
          try {
            var isDark = isDarkThemeActive();
            var topColor = isDark ? '#000000' : '#ffffff';
            var themeMetas = document.querySelectorAll('meta[name="theme-color"]');
            themeMetas.forEach(function(meta) {
              meta.setAttribute('content', topColor);
            });
            var statusMeta = document.getElementById('apple-status-bar-meta');
            if (statusMeta) statusMeta.setAttribute('content', 'black-translucent');

            document.documentElement.style.backgroundColor = topColor;
            document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
            if (document.body) document.body.style.backgroundColor = topColor;
            if (isDark) {
              document.documentElement.classList.add('dark');
              document.documentElement.classList.remove('light');
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
            }
            if (!localStorage.getItem('monvian_theme')) {
              localStorage.setItem('monvian_theme', isDark ? 'dark' : 'light');
            }

            var preloader = document.getElementById('monvian-app-preloader');
            if (preloader) preloader.style.backgroundColor = topColor;
          } catch (e) {}
        }
        window.__monvianIsDarkThemeActive = isDarkThemeActive;
        applySavedTheme();
      })();
    </script>
    <script>
      (function() {
        var dismissed = false;
        var minAnimationDone = false;
        var itinerariesReady = false;
        var minTimer = null;
        var maxTimer = null;

        function hasAuthenticatedSession() {
          try {
            var token = localStorage.getItem('monvian_token');
            var user = localStorage.getItem('monvian_user');
            if (token && user) return true;
            return document.cookie.indexOf('monvian_token=') !== -1;
          } catch (e) {
            return false;
          }
        }

        function hidePreloaderImmediately() {
          dismissed = true;
          window.__monvianPreloaderDismissed = true;
          if (minTimer) clearTimeout(minTimer);
          if (maxTimer) clearTimeout(maxTimer);
          var preloader = document.getElementById('monvian-app-preloader');
          if (preloader) {
            preloader.style.display = 'none';
            preloader.style.opacity = '0';
            preloader.style.pointerEvents = 'none';
          }
          try {
            window.dispatchEvent(new CustomEvent('monvian:preloader-dismissed'));
          } catch (e) {}
        }

        function dismissPreloader() {
          if (dismissed) return;
          dismissed = true;
          window.__monvianPreloaderDismissed = true;
          if (minTimer) clearTimeout(minTimer);
          if (maxTimer) clearTimeout(maxTimer);
          var preloader = document.getElementById('monvian-app-preloader');
          var stage = document.getElementById('monvian-preloader-stage');

          if (stage) {
            stage.style.transition = 'opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1), transform 0.42s cubic-bezier(0.22, 1, 0.36, 1)';
            stage.style.opacity = '0';
            stage.style.transform = 'scale(1.045)';
          }

          if (preloader) {
            preloader.style.transition = 'opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1)';
            preloader.style.opacity = '0';
            preloader.style.pointerEvents = 'none';

            setTimeout(function() {
              preloader.style.display = 'none';
            }, 500);
          }
          try {
            window.dispatchEvent(new CustomEvent('monvian:preloader-dismissed'));
          } catch (e) {}
        }

        function tryFinishPreloader() {
          if (dismissed) return;
          if (minAnimationDone && itinerariesReady) {
            dismissPreloader();
          }
        }

        function playLogoPreloaderSequence(minMs, maxMs) {
          dismissed = false;
          window.__monvianPreloaderDismissed = false;
          minAnimationDone = false;
          if (minTimer) clearTimeout(minTimer);
          if (maxTimer) clearTimeout(maxTimer);

          var isDark =
            (typeof window.__monvianIsDarkThemeActive === 'function' && window.__monvianIsDarkThemeActive()) ||
            document.documentElement.classList.contains('dark');

          var preloader = document.getElementById('monvian-app-preloader');
          var stage = document.getElementById('monvian-preloader-stage');
          var lightLogo = document.getElementById('monvian-preloader-light-logo');
          var darkLogo = document.getElementById('monvian-preloader-dark-logo');

          if (preloader) {
            preloader.style.transition = 'none';
            preloader.style.backgroundColor = isDark ? '#000000' : '#ffffff';
            preloader.style.opacity = '1';
            preloader.style.pointerEvents = 'auto';
            preloader.style.display = 'flex';
          }

          if (stage) {
            stage.style.transition = 'none';
            stage.style.opacity = '1';
            stage.style.transform = 'scale(1)';
          }

          if (isDark) {
            if (lightLogo) lightLogo.style.display = 'none';
            if (darkLogo) {
              darkLogo.style.display = 'block';
              darkLogo.style.animation = 'none';
              void darkLogo.offsetWidth;
              darkLogo.style.animation = 'monvianLogoMotionIntro 1.85s cubic-bezier(0.22, 1, 0.36, 1) forwards';
            }
          } else {
            if (darkLogo) darkLogo.style.display = 'none';
            if (lightLogo) {
              lightLogo.style.display = 'block';
              lightLogo.style.animation = 'none';
              void lightLogo.offsetWidth;
              lightLogo.style.animation = 'monvianLogoMotionIntro 1.85s cubic-bezier(0.22, 1, 0.36, 1) forwards';
            }
          }

          minTimer = setTimeout(function() {
            minAnimationDone = true;
            tryFinishPreloader();
          }, minMs || 1750);

          maxTimer = setTimeout(function() {
            dismissPreloader();
          }, maxMs || 3200);
        }

        window.__monvianMarkItinerariesPreloaded = function() {
          itinerariesReady = true;
          tryFinishPreloader();
        };

        window.__monvianReplayLogoPreloader = function() {
          itinerariesReady = false;
          playLogoPreloaderSequence(1550, 2900);
        };

        function initLogoPreloader() {
          // Never show the Monvian logo loading screen on the Login / Landing screen
          if (!hasAuthenticatedSession()) {
            hidePreloaderImmediately();
            return;
          }
          playLogoPreloaderSequence(1750, 3200);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initLogoPreloader);
        } else {
          initLogoPreloader();
        }
      })();
    </script>
    <!-- Dynamic Viewport Height & Zoom Lock for iOS/Android Mobile Devices -->
    <script>
      (function() {
        function isTextInputActive() {
          try {
            var el = document.activeElement;
            if (!el) return false;
            var tag = (el.tagName || '').toUpperCase();
            return tag === 'INPUT' || tag === 'TEXTAREA' || Boolean(el.isContentEditable);
          } catch (e) {
            return false;
          }
        }

        var lastViewportMetaRefreshAt = 0;

        function refreshIOSViewportMetaIfNeeded(isIOS, isStandalone, innerH, screenH) {
          try {
            if (!isIOS || screenH <= 0 || innerH <= 0) return;
            var delta = screenH - innerH;
            if ((isStandalone || delta <= 105) && delta > 2) {
              var now = Date.now();
              if (now - lastViewportMetaRefreshAt > 250) {
                lastViewportMetaRefreshAt = now;
                var vpMeta = document.querySelector('meta[name="viewport"]');
                if (vpMeta) {
                  vpMeta.setAttribute(
                    'content',
                    'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'
                  );
                }
              }
            }
          } catch (e) {}
        }

        var lastAppliedHeight = -1;
        var lastAppliedKeyboard = false;
        var pendingStabilizeTimers = [];

        function updateAppHeight() {
          try {
            var isStandalone =
              Boolean(window.navigator && window.navigator.standalone === true) ||
              Boolean(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
              Boolean(window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches);

            var isIOS =
              /iPhone|iPod|iPad/i.test(navigator.userAgent || '') ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            var isLandscape = false;
            if (window.screen && window.screen.orientation && typeof window.screen.orientation.angle === 'number') {
              isLandscape = Math.abs(window.screen.orientation.angle) === 90;
            } else if (typeof window.orientation === 'number') {
              isLandscape = Math.abs(Number(window.orientation)) === 90;
            } else if (window.matchMedia) {
              isLandscape = window.matchMedia('(orientation: landscape)').matches;
            }

            var screenH = 0;
            if (window.screen && window.screen.height && window.screen.width) {
              screenH = isLandscape
                ? Math.min(window.screen.width, window.screen.height)
                : Math.max(window.screen.width, window.screen.height);
            }

            var innerH = window.innerHeight || 0;
            var clientH = (document.documentElement && document.documentElement.clientHeight) || 0;
            var vvH = (window.visualViewport && window.visualViewport.height) || 0;
            var vvOffsetTop = (window.visualViewport && window.visualViewport.offsetTop) || 0;

            var keyboardOpen = isTextInputActive() && vvH > 0 && screenH > 0 && vvH < screenH * 0.78;

            var h = 0;
            if (keyboardOpen) {
              h = Math.round(vvH || innerH || clientH);
            } else if (isStandalone && screenH > 0) {
              h = Math.round(Math.max(innerH, clientH, vvH + vvOffsetTop, screenH));
              refreshIOSViewportMetaIfNeeded(isIOS, true, innerH, screenH);
            } else {
              var candidate = Math.max(innerH, clientH, Math.round(vvH + vvOffsetTop));
              if (isIOS && screenH > candidate && (screenH - candidate) <= 105) {
                h = Math.round(screenH);
                refreshIOSViewportMetaIfNeeded(isIOS, false, innerH, screenH);
              } else {
                h = Math.round(candidate || screenH);
              }
            }

            // Skip redundant DOM style mutations and forced layouts when viewport height did not change
            if (h === lastAppliedHeight && keyboardOpen === lastAppliedKeyboard) {
              return;
            }
            lastAppliedHeight = h;
            lastAppliedKeyboard = keyboardOpen;

            if (keyboardOpen && h > 0) {
              var hPx = h + 'px';
              document.documentElement.style.setProperty('--app-height', hPx);
              document.documentElement.style.setProperty('--app-height-px', hPx);
              document.documentElement.style.height = hPx;
              document.documentElement.style.minHeight = hPx;
              if (document.body) {
                document.body.style.height = hPx;
                document.body.style.minHeight = hPx;
              }
              var rootEl = document.getElementById('root');
              if (rootEl) {
                rootEl.style.height = hPx;
                rootEl.style.minHeight = hPx;
              }
            } else {
              var fullH = h > 0 ? 'max(' + h + 'px, 100dvh)' : '100dvh';
              if (h > 0) {
                document.documentElement.style.setProperty('--app-height-px', h + 'px');
              }
              document.documentElement.style.setProperty('--app-height', fullH);
              document.documentElement.style.height = fullH;
              document.documentElement.style.minHeight = fullH;
              if (document.body) {
                document.body.style.height = fullH;
                document.body.style.minHeight = fullH;
              }
              var rootElReset = document.getElementById('root');
              if (rootElReset) {
                rootElReset.style.height = fullH;
                rootElReset.style.minHeight = fullH;
              }
              var preloaderEl = document.getElementById('monvian-app-preloader');
              if (preloaderEl) {
                preloaderEl.style.height = fullH;
                preloaderEl.style.minHeight = fullH;
              }
            }

            if (
              !keyboardOpen &&
              document.body &&
              !document.body.classList.contains('is-login-screen') &&
              !document.documentElement.classList.contains('is-login-screen')
            ) {
              if (window.scrollY !== 0 || document.documentElement.scrollTop !== 0) {
                if (window.scrollTo) window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
              }
            }

            try {
              window.dispatchEvent(new CustomEvent('monvian:viewport-stabilized', { detail: { height: h } }));
            } catch (err) {}
          } catch (e) {}
        }

        function scheduleViewportStabilization() {
          for (var i = 0; i < pendingStabilizeTimers.length; i++) {
            clearTimeout(pendingStabilizeTimers[i]);
          }
          pendingStabilizeTimers.length = 0;
          updateAppHeight();
          if (window.requestAnimationFrame) {
            window.requestAnimationFrame(updateAppHeight);
          }
          pendingStabilizeTimers.push(
            setTimeout(updateAppHeight, 120),
            setTimeout(updateAppHeight, 350),
            setTimeout(updateAppHeight, 800)
          );
        }

        window.__monvianUpdateViewportHeight = updateAppHeight;
        window.__monvianScheduleViewportStabilization = scheduleViewportStabilization;

        scheduleViewportStabilization();
        if (window.scrollTo) window.scrollTo(0, 0);

        window.addEventListener('resize', updateAppHeight, { passive: true });
        window.addEventListener('orientationchange', scheduleViewportStabilization, { passive: true });
        window.addEventListener('pageshow', scheduleViewportStabilization, { passive: true });
        window.addEventListener('focus', updateAppHeight, { passive: true });
        window.addEventListener('load', scheduleViewportStabilization, { passive: true });
        document.addEventListener('DOMContentLoaded', scheduleViewportStabilization, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', updateAppHeight, { passive: true });
        }
        if (window.screen && window.screen.orientation) {
          window.screen.orientation.addEventListener('change', scheduleViewportStabilization, { passive: true });
        }
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') updateAppHeight();
        }, { passive: true });

        // Helper: Check if touch/event target is inside the interactive map or login screen
        function isZoomAllowed(target) {
          if (!target) return false;
          if (target.nodeType === 3) target = target.parentElement;
          if (target && target.closest && target.closest('#app-map-layer, .maplibregl-map, .maplibregl-canvas-container, .maplibregl-canvas, .maplibregl-marker, .monvian-explore-marker, #map, [data-map-container]')) {
            return true;
          }
          if (target && target.closest && target.closest('#auth-main-section, [data-allow-zoom="true"], .auth-login-screen, #input-login-email, #input-login-password, .login-zoom-container')) {
            return true;
          }
          if (document.body && (document.body.classList.contains('is-login-screen') || document.documentElement.classList.contains('is-login-screen'))) {
            return true;
          }
          return false;
        }

        function isTouchEventInAllowedZone(e) {
          if (isZoomAllowed(e.target)) return true;
          if (e.touches && e.touches.length > 0) {
            for (var i = 0; i < e.touches.length; i++) {
              if (isZoomAllowed(e.touches[i].target)) return true;
            }
          }
          return false;
        }

        // Prevent pinch gesture zoom on iOS Safari outside map and login screen
        document.addEventListener('gesturestart', function(e) {
          if (!isZoomAllowed(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('gesturechange', function(e) {
          if (!isZoomAllowed(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('gestureend', function(e) {
          if (!isZoomAllowed(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent multi-touch pinch outside map without interfering with 2-finger map pinch-to-zoom
        var pinchMoveGuardActive = false;
        function onPinchTouchMove(e) {
          if (!e.touches || e.touches.length < 2) return;
          if (!isTouchEventInAllowedZone(e)) {
            e.preventDefault();
          }
        }
        function clearPinchMoveGuard() {
          if (!pinchMoveGuardActive) return;
          pinchMoveGuardActive = false;
          document.removeEventListener('touchmove', onPinchTouchMove, false);
        }

        document.addEventListener('touchstart', function(e) {
          if (!e.touches || e.touches.length < 2) return;
          if (!isTouchEventInAllowedZone(e)) {
            e.preventDefault();
            if (!pinchMoveGuardActive) {
              pinchMoveGuardActive = true;
              document.addEventListener('touchmove', onPinchTouchMove, { passive: false });
            }
          }
        }, { passive: false });

        document.addEventListener('touchend', function(e) {
          if (!e.touches || e.touches.length < 2) clearPinchMoveGuard();
        }, { passive: true });
        document.addEventListener('touchcancel', clearPinchMoveGuard, { passive: true });

        // Prevent Ctrl + Mouse Wheel zoom on UI elements outside map and login screen
        document.addEventListener('wheel', function(e) {
          if (e.ctrlKey && !isZoomAllowed(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent keyboard zoom shortcuts (Ctrl/Cmd + +/-/0) outside map and login screen
        document.addEventListener('keydown', function(e) {
          if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
            if (!isZoomAllowed(e.target)) {
              e.preventDefault();
            }
          }
        });
      })();
    </script>

    <div id="monvian-app-preloader" style="position:fixed;inset:0;width:100%;height:var(--app-height,100dvh);min-height:var(--app-height,100dvh);display:none;flex-direction:column;align-items:center;justify-content:center;background-color:#ffffff;overflow:hidden;z-index:99999;user-select:none;-webkit-user-select:none;touch-action:none;">
      <div id="monvian-preloader-stage" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;will-change:transform,opacity;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px 12px;">
          <img
            id="monvian-preloader-light-logo"
            src="/assets/aistudio/monvian_logo_dark_transparent.png"
            alt="Monvian"
            draggable="false"
            decoding="sync"
            style="width:248px;max-width:64vw;height:auto;object-fit:contain;display:none;pointer-events:none;user-select:none;-webkit-user-select:none;will-change:transform,opacity,filter;"
          />
          <img
            id="monvian-preloader-dark-logo"
            src="/logomodoescuro.png"
            alt="Monvian"
            draggable="false"
            decoding="sync"
            style="width:248px;max-width:64vw;height:auto;object-fit:contain;display:none;pointer-events:none;user-select:none;-webkit-user-select:none;will-change:transform,opacity,filter;"
          />
        </div>
        <div id="monvian-preloader-spinner" role="status" aria-label="Carregando" style="width:22px;height:22px;display:flex;align-items:center;justify-content:center;pointer-events:none;">
          <svg id="monvian-preloader-ring-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;animation:monvianCircularRotate 0.92s linear infinite;will-change:transform;">
            <circle id="monvian-preloader-ring-track" cx="12" cy="12" r="9.25" stroke="rgba(0,0,0,0.10)" stroke-width="1.85" />
