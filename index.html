<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Monvian" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="apple-status-bar-meta" />
    <meta name="theme-color" content="#000000" id="theme-color-meta" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/loogo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/loogo.png" />
    <script>
      (function() {
        try {
          localStorage.setItem('monvian_theme', 'light');
          var topColor = '#ffffff';
          var statusStyle = 'default';
          var logoSrc = '/logocarregamento.png';

          var themeMetas = document.querySelectorAll('meta[name="theme-color"]');
          themeMetas.forEach(function(meta) {
            meta.setAttribute('content', topColor);
          });
          var statusMeta = document.getElementById('apple-status-bar-meta');
          if (statusMeta) statusMeta.setAttribute('content', statusStyle);

          document.documentElement.style.backgroundColor = '#ffffff';
          if (document.body) document.body.style.backgroundColor = '#ffffff';
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');

          var preloader = document.getElementById('monvian-app-preloader');
          if (preloader) preloader.style.backgroundColor = '#ffffff';
          var preloaderLogo = document.getElementById('monvian-preloader-logo');
          if (preloaderLogo) preloaderLogo.setAttribute('src', logoSrc);
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        var dismissed = false;
        function dismissPreloader() {
          if (dismissed) return;
          dismissed = true;
          var preloader = document.getElementById('monvian-app-preloader');
          var preloaderLogo = document.getElementById('monvian-preloader-logo');
          if (preloaderLogo) {
            preloaderLogo.style.animation = 'monvianLogoSpringExit 0.45s cubic-bezier(0.32, 0, 0.67, 0) forwards';
          }
          if (preloader) {
            setTimeout(function() {
              preloader.style.transition = 'opacity 0.38s cubic-bezier(0.16, 1, 0.3, 1)';
              preloader.style.opacity = '0';
              setTimeout(function() {
                preloader.style.display = 'none';
              }, 400);
            }, 220);
          }
        }

        window.addEventListener('load', function() {
          setTimeout(dismissPreloader, 1450);
        });
        // Fallback safety timer in case load event already fired or takes longer
        setTimeout(dismissPreloader, 2400);
      })();
    </script>
    <!-- Dynamic Viewport Height & Zoom Lock for iOS/Android Mobile Devices -->
    <script>
      (function() {
        function updateAppHeight() {
          try {
            var h = (window.visualViewport && window.visualViewport.height) ||
              window.innerHeight ||
              (document.documentElement && document.documentElement.clientHeight) ||
              0;

            if (h && h > 0) {
              document.documentElement.style.setProperty('--app-height', h + 'px');
            }
          } catch (e) {}
        }

        updateAppHeight();
        if (window.scrollTo) window.scrollTo(0, 0);

        function handleOrientation() {
          updateAppHeight();
          if (window.requestAnimationFrame) window.requestAnimationFrame(updateAppHeight);
          setTimeout(updateAppHeight, 50);
          setTimeout(updateAppHeight, 150);
        }

        window.addEventListener('resize', updateAppHeight, { passive: true });
        window.addEventListener('orientationchange', handleOrientation, { passive: true });
        window.addEventListener('pageshow', updateAppHeight, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', updateAppHeight, { passive: true });
        }
        if (window.screen && window.screen.orientation) {
          window.screen.orientation.addEventListener('change', handleOrientation, { passive: true });
        }
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') updateAppHeight();
        }, { passive: true });

        // Helper: Check if touch/event target is inside the interactive map
        function isInsideMap(target) {
          if (!target) return false;
          if (target.nodeType === 3) target = target.parentElement; // handle text nodes
          return !!(target && target.closest && target.closest('.maplibregl-map, .maplibregl-canvas-container, .maplibregl-canvas, #map, [data-map-container]'));
        }

        // Prevent pinch gesture zoom on iOS Safari outside map
        document.addEventListener('gesturestart', function(e) {
          if (!isInsideMap(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('gesturechange', function(e) {
          if (!isInsideMap(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('gestureend', function(e) {
          if (!isInsideMap(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent multi-touch pinch on body/elements outside map
        document.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 1) {
            if (!isInsideMap(e.target)) {
              e.preventDefault();
            }
          }
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            if (!isInsideMap(e.target)) {
              e.preventDefault();
            }
          }
        }, { passive: false });

        // Prevent Ctrl + Mouse Wheel zoom on UI elements outside map
        document.addEventListener('wheel', function(e) {
          if (e.ctrlKey && !isInsideMap(e.target)) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent keyboard zoom shortcuts (Ctrl/Cmd + +/-/0)
        document.addEventListener('keydown', function(e) {
          if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
            e.preventDefault();
          }
        });
      })();
    </script>
    <title>Monvian</title>
    <meta name="description" content="Seu guia inteligente para viver Campos do Jordão." />
    <meta property="og:title" content="Monvian" />
    <meta property="og:description" content="Seu guia inteligente para viver Campos do Jordão." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Inter Font Family & Vintage Handwriting Script Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Marck+Script&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="monvian-app-preloader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#ffffff;z-index:99999;user-select:none;-webkit-user-select:none;touch-action:none;">
      <img id="monvian-preloader-logo" src="/logocarregamento.png" alt="Monvian" style="height:72px;width:auto;max-width:280px;object-fit:contain;opacity:0;transform:translateY(12px) scale(0.88);animation:monvianLogoSpringEnter 0.58s cubic-bezier(0.22, 1.35, 0.36, 1) 0.08s forwards;will-change:transform,opacity;" />
    </div>
    <style>
      @keyframes monvianLogoSpringEnter {
        0% {
          opacity: 0;
          transform: translateY(12px) scale(0.88);
        }
        68% {
          opacity: 1;
          transform: translateY(-2px) scale(1.03);
        }
        100% {
          opacity: 1;
          transform: translateY(0px) scale(1);
        }
      }
      @keyframes monvianLogoSpringExit {
        0% {
          opacity: 1;
          transform: translateY(0px) scale(1);
        }
        28% {
          opacity: 1;
          transform: translateY(-2px) scale(1.02);
        }
        100% {
          opacity: 0;
          transform: translateY(12px) scale(0.88);
        }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
