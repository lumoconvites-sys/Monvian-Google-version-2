<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161a"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0000FF"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle border inside -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  
  <!-- Stylized Mountain & Pine tree compass for Monvian -->
  <g transform="translate(96, 86)">
    <!-- Mountain Peaks -->
    <path d="M160 30 L270 210 L50 210 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M160 30 L220 210 L160 210 Z" fill="#e2e8f0" fill-opacity="0.95"/>
    
    <!-- Secondary Peak with Emerald tint -->
    <path d="M90 100 L180 230 L0 230 Z" fill="#ffffff" fill-opacity="0.75"/>
    
    <!-- Stylized Monvian "M" Base -->
    <path d="M30 270 L80 180 L160 240 L240 180 L290 270 L250 270 L240 250 L160 310 L80 250 L70 270 Z" fill="url(#emerald)"/>
    
    <!-- Modern Compass Star Point -->
    <circle cx="160" cy="110" r="12" fill="url(#emerald)"/>
  </g>
  
  <!-- Brand text at bottom -->
  <text x="256" y="430" font-family="'Manrope', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="6" text-anchor="middle">MONVIAN</text>
  <text x="256" y="460" font-family="'Manrope', -apple-system, sans-serif" font-size="18" font-weight="600" fill="#0000FF" letter-spacing="3" text-anchor="middle">CAMPOS DO JORDÃO</text>
</svg>
